[project]
name = "websem-api"
version = "0.1.0"
description = "FastAPI backend for the Web Semantique mini-project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "fr-core-news-sm",
    "nltk>=3.8",
    "pydantic-settings>=2.6.0",
    "rdflib>=7.0.0",
    "pyparsing>=3.1.4,<3.2",
    "spacy>=3.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }
